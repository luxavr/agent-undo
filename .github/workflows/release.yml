# Cut GitHub Release binaries for tags matching v*.
# Cross-compiled targets are built, not executed. CI (ci.yml) runs tests on
# ubuntu-latest and macos-latest; that is not a substitute for this job.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/build-release.sh
          cat > release-notes.md <<'EOF'
          Prebuilt binaries for macOS and Linux. Windows is unsupported.

          Download the asset for your platform, verify it against checksums.txt, then install into ~/.local/bin. Do not skip the checksum step.

          Cross-compiled targets (darwin/*, linux/arm64) are built in this workflow, not executed. Tests run on ubuntu-latest and macos-latest via ci.yml.

          No Homebrew formula. No curl | sh installer.
          EOF
          echo "artifacts:"
          ls -l dist
          cat build-info.txt
          echo "checksums:"
          cat checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            dist/agent-undo_* \
            checksums.txt \
            build-info.txt \
            --title "${VERSION}" \
            --notes-file release-notes.md
