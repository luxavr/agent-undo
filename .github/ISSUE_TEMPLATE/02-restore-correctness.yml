name: Restore correctness
description: Undo, verify, or recover did not return the checkpointed state, but you do not think data is gone yet.
title: "[RESTORE-CORRECTNESS] "
labels: ["RESTORE-CORRECTNESS"]
body:
  - type: markdown
    attributes:
      value: If files are already missing or wrong on disk, use the Data safety template instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands
      render: shell
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - undo
        - verify
        - recover
        - run
        - other
    validations:
      required: true
  - type: dropdown
    id: attach
    attributes:
      label: How did you run the agent?
      description: v0.1 only protects agents wrapped with `agent-undo run`. Pick the closest match. This is not market telemetry.
      options:
        - Wrapped a terminal agent (`agent-undo run …`)
        - Editor-native (Cursor or similar), not wrapped
        - Not sure / other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: true
